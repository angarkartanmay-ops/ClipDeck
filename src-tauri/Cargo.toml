[package]
name = "clipdeck"
version = "0.1.1"
description = "Lightweight, always-on clipboard manager for Windows, macOS and Linux"
authors = ["Tanmay Angarkar <angarkartanmay@gmail.com>"]
license-file = "../LICENSE"
repository = "https://github.com/angarkartanmay-ops/ClipDeck"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
base64 = "0.22"

# ---------------------------------------------------------------- Windows

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

# ---------------------------------------------------------------- macOS and Linux

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

# ---------------------------------------------------------------- macOS

[target.'cfg(target_os = "macos")'.dependencies]
# Same versions Tauri already links, so nothing is duplicated.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework = "3"
chacha20poly1305 = "0.10"
getrandom = "0.3"
# macOS apps often copy images as TIFF only.
image = { version = "0.25", default-features = false, features = ["tiff"] }

# ---------------------------------------------------------------- Linux

[target.'cfg(target_os = "linux")'.dependencies]
x11-clipboard = "0.9"
# Same version x11-clipboard uses, for its connection type.
x11rb = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
