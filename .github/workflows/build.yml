name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: License policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo deny (licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses bans sources
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm license check (production deps)
        run: npm run licenses

  test:
    name: Lint and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Type-check and build dashboard
        run: npm run build
      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Installers
    needs: [licenses, test]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # Optional code signing. Add these repository secrets to enable it:
      #   WINDOWS_CERTIFICATE           base64 of a .pfx code-signing certificate
      #   WINDOWS_CERTIFICATE_PASSWORD  its password
      - name: Prepare code signing
        id: sign
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERT) { "Code signing disabled (no certificate secret)."; "config={}" >> $env:GITHUB_OUTPUT; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object FullName -match "x64" | Sort-Object FullName -Descending | Select-Object -First 1
          $cmd = "`"$($signtool.FullName)`" sign /fd SHA256 /f `"$pfx`" /p `"$env:CERT_PASSWORD`" /tr http://timestamp.digicert.com /td SHA256 %1"
          $json = @{ bundle = @{ windows = @{ signCommand = $cmd } } } | ConvertTo-Json -Compress -Depth 5
          "config=$json" >> $env:GITHUB_OUTPUT

      - name: Build installers
        shell: pwsh
        env:
          SIGN_CONFIG: ${{ steps.sign.outputs.config }}
        run: |
          if ($env:SIGN_CONFIG -and $env:SIGN_CONFIG -ne "{}") { npx tauri build --config $env:SIGN_CONFIG }
          else { npx tauri build }

      - name: Collect artifacts and checksums
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $out = New-Item -ItemType Directory -Force dist-release
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe $out
          Copy-Item src-tauri/target/release/bundle/msi/*.msi $out
          $portable = New-Item -ItemType Directory -Force "portable/ClipDeck"
          Copy-Item src-tauri/target/release/clipdeck.exe $portable/ClipDeck.exe
          Copy-Item LICENSE, NOTICE, README.md, PRIVACY.md, THIRD_PARTY_LICENSES.md $portable
          Compress-Archive -Path "portable/ClipDeck/*" -DestinationPath "$out/ClipDeck_${version}_x64_portable.zip"
          Get-ChildItem $out -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii "$out/SHA256SUMS.txt"
          Get-Content "$out/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ClipDeck-windows-x64
          path: dist-release/*

      - name: Draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist-release/* --draft --title "ClipDeck ${{ github.ref_name }}" `
            --notes "Verify downloads against SHA256SUMS.txt. Unsigned builds may trigger a SmartScreen warning (More info → Run anyway)."
