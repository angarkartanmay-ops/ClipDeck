name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  licenses:
    name: License policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo deny (licenses, bans, sources; all platforms)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses bans sources
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm license check (production deps)
        run: npm run licenses

  test:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: npm ci
      - name: Type-check and build dashboard
        run: npm run build
      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Installers (${{ matrix.name }})
    needs: [licenses, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            rust-targets: aarch64-pc-windows-msvc
            bundles: nsis
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf libfuse2 file
      - run: npm ci

      # ---- Windows code signing (optional). Either an OV/EV certificate:
      #        WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
      #      or Azure Trusted Signing:
      #        AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
      #        TRUSTED_SIGNING_ENDPOINT, TRUSTED_SIGNING_ACCOUNT, TRUSTED_SIGNING_PROFILE
      #      Tauri signs the app executable, the installers and the uninstaller.
      - name: Prepare Windows code signing
        id: winsign
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TS_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TS_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TS_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: |
          if ($env:TS_ENDPOINT) {
            cargo install trusted-signing-cli --locked
            $windows = @{ signCommand = @{
              cmd = "trusted-signing-cli"
              args = @("-e", $env:TS_ENDPOINT, "-a", $env:TS_ACCOUNT, "-c", $env:TS_PROFILE, "-d", "ClipDeck", "%1")
            } }
          } elseif ($env:CERT) {
            $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
            $password = ConvertTo-SecureString -String $env:CERT_PASSWORD -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            Remove-Item $pfx
            $windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = "sha256"
              timestampUrl = "http://timestamp.digicert.com"
            }
          } else {
            "Windows code signing: off (no secrets). Builds are unsigned."
            "config={}" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $json = @{ bundle = @{ windows = $windows } } | ConvertTo-Json -Compress -Depth 6
          "config=$json" >> $env:GITHUB_OUTPUT

      # ---- macOS signing and notarization (optional). Without these the app
      #      is ad-hoc signed. Secrets: APPLE_CERTIFICATE (base64 .p12),
      #      APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, and for
      #      notarization APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID.
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only export what is set: Tauri treats an empty variable as present.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<__EOF__"; echo "${!v}"; echo "__EOF__"; } >> "$GITHUB_ENV"
            fi
          done
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "macOS signing: ad-hoc (no Developer ID secrets)."; fi

      - name: Build
        shell: bash
        env:
          SIGN_CONFIG: ${{ steps.winsign.outputs.config }}
          # Read by trusted-signing-cli; empty unless Trusted Signing is set up.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          args=(--target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}")
          if [ -n "$SIGN_CONFIG" ] && [ "$SIGN_CONFIG" != "{}" ]; then args+=(--config "$SIGN_CONFIG"); fi
          npx tauri build "${args[@]}"

      - name: Collect artifacts
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          root="src-tauri/target/${{ matrix.target }}/release"
          out=dist-release
          mkdir -p "$out"
          case "${{ matrix.name }}" in
            windows-*)
              arch=${{ matrix.name }}; arch=${arch#windows-}
              cp "$root"/bundle/nsis/*.exe "$out"/
              cp "$root"/bundle/msi/*.msi "$out"/ 2>/dev/null || true
              mkdir -p portable/ClipDeck
              cp "$root/clipdeck.exe" portable/ClipDeck/ClipDeck.exe
              cp LICENSE NOTICE README.md PRIVACY.md SECURITY.md THIRD_PARTY_LICENSES.md portable/ClipDeck/
              (cd portable && 7z a -tzip "../$out/ClipDeck_${version}_${arch}_portable.zip" ClipDeck >/dev/null)
              ;;
            macos-*)
              cp "$root"/bundle/dmg/*.dmg "$out"/
              ditto -c -k --keepParent "$root/bundle/macos/ClipDeck.app" "$out/ClipDeck_${version}_universal.app.zip"
              ;;
            linux-*)
              cp "$root"/bundle/deb/*.deb "$root"/bundle/rpm/*.rpm "$root"/bundle/appimage/*.AppImage "$out"/
              ;;
          esac
          cd "$out" && for f in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi
          done | tee "SHA256SUMS-${{ matrix.name }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ClipDeck-${{ matrix.name }}
          path: dist-release/*

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Policy templates for IT
        run: zip -r "dist/ClipDeck_${GITHUB_REF_NAME#v}_policy-templates.zip" policy docs/DEPLOYMENT.md
      - name: Combined checksums
        run: |
          cd dist
          rm -f SHA256SUMS-*.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "ClipDeck $TAG" \
            --notes "Downloads for Windows (x64, ARM64), macOS (Apple silicon and Intel) and Linux. Verify them against SHA256SUMS.txt. IT administrators: the policy-templates zip has the Group Policy (ADMX), macOS profile and Linux policy examples; docs/DEPLOYMENT.md covers silent installs and unsigned-build warnings."
          gh release upload "$TAG" dist/* --clobber
